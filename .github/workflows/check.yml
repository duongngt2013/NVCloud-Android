name: NVCloud-Android Check

on:
workflow_dispatch:

permissions:
contents: read

jobs:
validate:
name: Validate project
runs-on: ubuntu-latest
timeout-minutes: 5

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check project files
    run: |
      test -f README.md
      echo "README.md exists"
      echo "Project validation passed."
