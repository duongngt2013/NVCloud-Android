
name: NVCloud Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -e
          for file in README.md docker-compose.yml scripts/check-host.sh scripts/start-android.sh; do
            if [ -f "$file" ]; then
              echo "[OK] $file"
            else
              echo "[MISSING] $file"
              exit 1
            fi
          done
