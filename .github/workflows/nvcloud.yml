
name: NVCloud - Start Android Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvcloud-cloud
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      BLOMP_BUCKET: duongngt2013-at-gmail.com
      BACKUP_DIR: nvcloud/backups
      DEVICE: 127.0.0.1:5555

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y \
            rclone zstd android-tools-adb curl jq

      - name: Configure Blomp
        shell: bash
        env:
          BLOMP_ACCESS_KEY: ${{ secrets.BLOMP_ACCESS_KEY }}
          BLOMP_SECRET_KEY: ${{ secrets.BLOMP_SECRET_KEY }}
        run: |
          set -euo pipefail
          set +x

          if [ -z "$BLOMP_ACCESS_KEY" ] || [ -z "$BLOMP_SECRET_KEY" ]; then
            echo "BLOMP_SECRETS_MISSING"
            exit 1
          fi

          rclone config create blomp s3 \
            provider=Other \
            endpoint=https://storage.blomp.com \
            region=us-east-1 \
            access_key_id="$BLOMP_ACCESS_KEY" \
            secret_access_key="$BLOMP_SECRET_KEY"

          rclone lsd blomp:
          echo "BLOMP_CONNECTED"

      - name: Restore previous Android data
        shell: bash
        run: |
          set -euo pipefail

          DATA="$RUNNER_TEMP/redroid-data"
          REMOTE="blomp:$BLOMP_BUCKET/$BACKUP_DIR"
          LIST="$RUNNER_TEMP/backup-list.txt"
          LATEST="$RUNNER_TEMP/LATEST"
          ARCHIVE="$RUNNER_TEMP/nvcloud-backup.tar.zst"

          mkdir -p "$DATA"

          # Listing failure is an error, not an empty backup.
          rclone lsf "$REMOTE/" > "$LIST"

          if ! grep -Fxq "LATEST" "$LIST"; then
            echo "NO_PREVIOUS_BACKUP"
            echo "Creating a new Android data directory."
            exit 0
          fi

          rclone cat "$REMOTE/LATEST" > "$LATEST"

          if [ ! -s "$LATEST" ]; then
            echo "LATEST_POINTER_EMPTY"
            exit 1
          fi

          BACKUP_NAME=$(tr -d '\r\n' < "$LATEST")

          if [[ ! "$BACKUP_NAME" =~ ^nvcloud-[0-9]+\.tar\.zst$ ]]; then
            echo "INVALID_BACKUP_POINTER"
            exit 1
          fi

          echo "Restoring $BACKUP_NAME"

          rclone copyto "$REMOTE/$BACKUP_NAME" "$ARCHIVE"

          zstd -t "$ARCHIVE"

          sudo tar \
            --numeric-owner \
            --same-owner \
            --same-permissions \
            --zstd \
            -xf "$ARCHIVE" \
            -C "$DATA"

          if [ -z "$(sudo find "$DATA" -mindepth 1 -print -quit)" ]; then
            echo "RESTORE_DATA_EMPTY"
            exit 1
          fi

          echo "RESTORE_COMPLETE"

      - name: Prepare BinderFS
        shell: bash
        run: |
          set -eux

          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"

          sudo mkdir -p /dev/binderfs

          if ! mountpoint -q /dev/binderfs; then
            sudo mount -t binder binder /dev/binderfs
          fi

          ls -la /dev/binderfs

      - name: Start Android 13
        shell: bash
        run: |
          set -euo pipefail

          docker pull redroid/redroid:13.0.0-latest

          docker run -d \
            --name nvcloud-android \
            --privileged \
            --restart=no \
            -v "$RUNNER_TEMP/redroid-data:/data" \
            -v /dev/binderfs:/dev/binderfs \
            -p 127.0.0.1:5555:5555 \
            redroid/redroid:13.0.0-latest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=240

      - name: Connect ADB and initialize Android
        shell: bash
        run: |
          set -euo pipefail

          adb connect "$DEVICE"

          STATE=""

          for i in $(seq 1 60); do
            STATE=$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot check $i: $STATE"

            if [ "$STATE" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$STATE" != "1" ]; then
            echo "ANDROID_BOOT_FAILED"
            docker logs nvcloud-android
            exit 1
          fi

          touch "$RUNNER_TEMP/NVCLOUD_SESSION_READY"
          echo "ANDROID_BOOT_OK"

      - name: Check root
        shell: bash
        run: |
          set +e

          adb -s "$DEVICE" root
          sleep 3

          echo "=== ADB IDENTITY ==="
          adb -s "$DEVICE" shell id

          echo "=== BUILD TYPE ==="
          adb -s "$DEVICE" shell getprop ro.build.type

          echo "=== SU LOCATION ==="
          adb -s "$DEVICE" shell which su

          echo "=== SU TEST ==="
          adb -s "$DEVICE" shell su -c id

          echo "ROOT_DIAGNOSTIC_COMPLETE"

      - name: Install Lawnchair if missing
        shell: bash
        run: |
          set -euo pipefail

          if adb -s "$DEVICE" shell pm path app.lawnchair | grep -q package:; then
            echo "LAWNCHAIR_ALREADY_INSTALLED"
          else
            PAGE="$RUNNER_TEMP/lawnchair.html"
            APK="$RUNNER_TEMP/lawnchair.apk"

            curl -fsSL \
              "https://github.com/LawnchairLauncher/lawnchair/releases/expanded_assets/v14.0.0-beta3" \
              -o "$PAGE"

            APK_PATH=$(grep -oE 'href="[^"]+\.apk"' "$PAGE" \
              | head -n 1 \
              | cut -d '"' -f 2)

            if [ -z "$APK_PATH" ]; then
              echo "LAWNCHAIR_APK_NOT_FOUND"
              exit 1
            fi

            case "$APK_PATH" in
              http*) APK_URL="$APK_PATH" ;;
              *) APK_URL="https://github.com$APK_PATH" ;;
            esac

            curl -fL "$APK_URL" -o "$APK"

            adb -s "$DEVICE" install -r "$APK"

            rm -f "$APK" "$PAGE"
          fi

          adb -s "$DEVICE" shell cmd package set-home-activity \
            --user 0 app.lawnchair/.LawnchairLauncher || true

          adb -s "$DEVICE" shell am force-stop app.lawnchair

          adb -s "$DEVICE" shell am start \
            -n app.lawnchair/.LawnchairLauncher

          sleep 5

          adb -s "$DEVICE" exec-out screencap -p \
            > "$RUNNER_TEMP/nvcloud-screen.png"

          echo "LAWNCHAIR_READY"

      - name: Keep Cloud running
        shell: bash
        run: |
          set -euo pipefail

          echo "NVCloud Android 13 is running."
          echo "Session limit: 340 minutes."

          END=$((SECONDS + 340 * 60))

          while [ "$SECONDS" -lt "$END" ]; do
            RUNNING=$(docker inspect \
              -f '{{.State.Running}}' nvcloud-android 2>/dev/null || echo false)

            if [ "$RUNNING" != "true" ]; then
              echo "ANDROID_CONTAINER_STOPPED"
              exit 1
            fi

            sleep 30
          done

          echo "SESSION_TIME_LIMIT_REACHED"

      - name: Backup Android data to Blomp
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          DATA="$RUNNER_TEMP/redroid-data"
          ARCHIVE="$RUNNER_TEMP/nvcloud-backup.tar.zst"
          BACKUP_NAME="nvcloud-${GITHUB_RUN_ID}.tar.zst"
          REMOTE="blomp:$BLOMP_BUCKET/$BACKUP_DIR"
          REMOTE_BACKUP="$REMOTE/$BACKUP_NAME"

          # Do not overwrite a good backup with failed startup data.
          if [ ! -f "$RUNNER_TEMP/NVCLOUD_SESSION_READY" ]; then
            echo "BACKUP_SKIPPED: Android did not boot."
            docker rm -f nvcloud-android 2>/dev/null || true
            exit 0
          fi

          echo "=== STOP ANDROID ==="
          docker stop -t 30 nvcloud-android 2>/dev/null || true

          if [ ! -d "$DATA" ]; then
            echo "ANDROID_DATA_MISSING"
            exit 1
          fi

          DATA_SIZE=$(sudo du -s -B1 "$DATA" | awk '{print $1}')

          echo "Android data bytes: $DATA_SIZE"

          if [ "$DATA_SIZE" -lt 10485760 ]; then
            echo "BACKUP_REFUSED: Android data is unexpectedly small."
            exit 1
          fi

          echo "=== CREATE ARCHIVE ==="

          sudo tar \
            --numeric-owner \
            --acls \
            --xattrs \
            -I 'zstd -1 -T2' \
            -cf "$ARCHIVE" \
            -C "$DATA" .

          if [ ! -s "$ARCHIVE" ]; then
            echo "BACKUP_ARCHIVE_EMPTY"
            exit 1
          fi

          zstd -t "$ARCHIVE"

          echo "=== UPLOAD BACKUP ==="

          rclone copyto \
            "$ARCHIVE" \
            "$REMOTE_BACKUP" \
            --s3-chunk-size 100M \
            --transfers 1 \
            --checkers 2 \
            --retries 3 \
            --low-level-retries 5

          echo "=== VERIFY REMOTE SIZE ==="

          LOCAL_SIZE=$(stat -c %s "$ARCHIVE")

          REMOTE_SIZE=$(rclone lsjson "$REMOTE_BACKUP" \
            | jq -r '.[0].Size')

          if [ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]; then
            echo "BACKUP_SIZE_MISMATCH"
            exit 1
          fi

          # Update LATEST only after archive upload and size check succeed.
          printf '%s\n' "$BACKUP_NAME" > "$RUNNER_TEMP/LATEST"

          rclone copyto \
            "$RUNNER_TEMP/LATEST" \
            "$REMOTE/LATEST"

          echo "NVCLOUD_BACKUP_OK"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker logs nvcloud-android 2>/dev/null || true
          docker rm -f nvcloud-android 2>/dev/null || true
          rm -f "$RUNNER_TEMP/lawnchair.apk"
          rm -f "$RUNNER_TEMP/lawnchair.html"
          rm -f "$RUNNER_TEMP/nvcloud-backup.tar.zst"
