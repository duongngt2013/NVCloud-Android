
name: NVCloud Launcher Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Prepare BinderFS
        shell: bash
        run: |
          set -eux
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs

      - name: Start Android 13
        shell: bash
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/redroid-data"

          docker pull redroid/redroid:13.0.0-latest

          docker run -d \
            --name nvcloud-android \
            --privileged \
            -v "$RUNNER_TEMP/redroid-data:/data" \
            -v /dev/binderfs:/dev/binderfs \
            -p 127.0.0.1:5555:5555 \
            redroid/redroid:13.0.0-latest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=240

      - name: Install Lawnchair
        shell: bash
        run: |
          set -eux

          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb aapt jq

          DEVICE="127.0.0.1:5555"
          adb connect "$DEVICE"

          STATE=""
          for i in $(seq 1 60); do
            STATE=$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot check $i: $STATE"
            [ "$STATE" = "1" ] && break
            sleep 5
          done

          if [ "$STATE" != "1" ]; then
            echo "ANDROID_BOOT_FAILED"
            docker logs nvcloud-android
            exit 1
          fi

          mkdir -p output

          API="https://api.github.com/repos/LawnchairLauncher/lawnchair/releases/tags/v14.0.0-beta3"

          curl -fsSL "$API" -o output/release.json

          APK_URL=$(jq -r '[.assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty' output/release.json)

          if [ -z "$APK_URL" ]; then
            echo "LAWNCHAIR_APK_NOT_FOUND"
            jq -r '.assets[].name' output/release.json
            exit 1
          fi

          curl -fL "$APK_URL" -o output/lawnchair.apk

          echo "=== APK INFO ==="
          aapt dump badging output/lawnchair.apk | head -n 5

          echo "=== INSTALL ==="
          adb -s "$DEVICE" install -r output/lawnchair.apk

          PACKAGE=$(aapt dump badging output/lawnchair.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          ACTIVITY=$(aapt dump badging output/lawnchair.apk | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")

          echo "Package: $PACKAGE"
          echo "Activity: $ACTIVITY"

          if [ -z "$PACKAGE" ] || [ -z "$ACTIVITY" ]; then
            echo "LAUNCHER_ACTIVITY_NOT_FOUND"
            exit 1
          fi

          adb -s "$DEVICE" shell am start -n "$PACKAGE/$ACTIVITY"
          sleep 5
          adb -s "$DEVICE" shell input keyevent HOME
          sleep 3

          echo "=== HOME RESOLVER ==="
          adb -s "$DEVICE" shell cmd package resolve-activity --brief \
            -a android.intent.action.MAIN \
            -c android.intent.category.HOME || true

          echo "=== SCREENSHOT ==="
          adb -s "$DEVICE" exec-out screencap -p > output/lawnchair-screen.png

          echo "LAUNCHER_TEST_COMPLETE"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcloud-launcher-test
          path: output/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker logs nvcloud-android 2>/dev/null || true
          docker rm -f nvcloud-android 2>/dev/null || true
