
name: NVCloud Redroid Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Prepare BinderFS
        shell: bash
        run: |
          set -eux
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          echo "=== BinderFS devices ==="
          ls -la /dev/binderfs
          echo "=== Binder module ==="
          lsmod | grep binder

      - name: Start Android 13
        shell: bash
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/redroid-data"

          docker pull redroid/redroid:13.0.0-latest

          docker run -d \
            --name nvcloud-redroid \
            --privileged \
            -v "$RUNNER_TEMP/redroid-data:/data" \
            -v /dev/binderfs:/dev/binderfs \
            -p 127.0.0.1:5555:5555 \
            redroid/redroid:13.0.0-latest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=240

          echo "=== Container status ==="
          docker ps -a

          echo "=== Binder devices inside container ==="
          docker exec nvcloud-redroid ls -la /dev/binderfs || true

      - name: Wait for Android boot
        shell: bash
        run: |
          set -e

          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb

          adb connect 127.0.0.1:5555

          for i in $(seq 1 36); do
            STATE=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            echo "Boot check $i: $STATE"

            if [ "$STATE" = "1" ]; then
              echo "ANDROID_BOOT_SUCCESS"
              echo "Android version:"
              adb -s 127.0.0.1:5555 shell getprop ro.build.version.release
              echo "Build:"
              adb -s 127.0.0.1:5555 shell getprop ro.build.display.id
              exit 0
            fi

            sleep 5
          done

          echo "ANDROID_BOOT_FAILED"
          echo "=== Container logs ==="
          docker logs nvcloud-redroid
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "=== Final container logs ==="
          docker logs nvcloud-redroid 2>/dev/null || true

          docker rm -f nvcloud-redroid 2>/dev/null || true
