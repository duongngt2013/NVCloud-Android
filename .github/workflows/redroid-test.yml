
name: NVCloud Android 13 Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Prepare output
        shell: bash
        run: |
          set -eux
          mkdir -p output "$RUNNER_TEMP/nvcloud"

      - name: Prepare BinderFS
        shell: bash
        run: |
          set -eux
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs

      - name: Start Android 13
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/redroid-data"

          docker pull redroid/redroid:13.0.0-latest

          docker run -d \
            --name nvcloud-android \
            --privileged \
            -v "$RUNNER_TEMP/redroid-data:/data" \
            -v /dev/binderfs:/dev/binderfs \
            -p 127.0.0.1:5555:5555 \
            redroid/redroid:13.0.0-latest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=240

      - name: Install and initialize Lawnchair
        shell: bash
        run: |
          set -eux
          exec > >(tee -a output/setup.log) 2>&1

          sudo apt-get update -qq
          sudo apt-get install -y android-tools-adb aapt

          DEVICE="127.0.0.1:5555"

          echo "=== CONNECT ADB ==="
          adb connect "$DEVICE"

          STATE=""

          for i in $(seq 1 60); do
            STATE=$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "Boot check $i: $STATE"

            [ "$STATE" = "1" ] && break
            sleep 5
          done

          if [ "$STATE" != "1" ]; then
            echo "ANDROID_BOOT_FAILED"
            docker logs nvcloud-android
            exit 1
          fi

          echo "ANDROID_BOOT_SUCCESS"

          echo "=== DOWNLOAD LAWNCHAIR ==="

          RELEASE_PAGE="https://github.com/LawnchairLauncher/lawnchair/releases/expanded_assets/v14.0.0-beta3"
          APK="$RUNNER_TEMP/lawnchair.apk"
          ASSETS_HTML="$RUNNER_TEMP/lawnchair-assets.html"

          curl -fLsS \
            -A "Mozilla/5.0 NVCloud" \
            "$RELEASE_PAGE" \
            -o "$ASSETS_HTML"

          APK_PATH=$(grep -oE 'href="[^"]+\.apk"' "$ASSETS_HTML" \
            | head -n 1 \
            | cut -d '"' -f 2)

          if [ -z "$APK_PATH" ]; then
            echo "LAWNCHAIR_APK_NOT_FOUND"
            exit 1
          fi

          case "$APK_PATH" in
            http://*|https://*)
              APK_URL="$APK_PATH"
              ;;
            *)
              APK_URL="https://github.com${APK_PATH}"
              ;;
          esac

          echo "APK URL: $APK_URL"

          curl -fL \
            -A "Mozilla/5.0 NVCloud" \
            "$APK_URL" \
            -o "$APK"

          if [ ! -s "$APK" ]; then
            echo "APK_DOWNLOAD_FAILED"
            exit 1
          fi

          echo "=== APK DOWNLOADED ==="
          ls -lh "$APK"

          echo "=== INSTALL APK ==="
          adb -s "$DEVICE" install -r "$APK"

          echo "=== DELETE TEMPORARY APK ==="
          rm -f "$APK" "$ASSETS_HTML"

          echo "=== SET DEFAULT HOME ==="
          adb -s "$DEVICE" shell cmd package set-home-activity --user 0 app.lawnchair/.LawnchairLauncher || true

          echo "=== OPEN LAWNCHAIR ==="
          adb -s "$DEVICE" shell am force-stop app.lawnchair

          adb -s "$DEVICE" shell am start \
            -n app.lawnchair/.LawnchairLauncher

          sleep 5

          echo "=== SCREEN BEFORE SETUP ==="
          adb -s "$DEVICE" exec-out screencap -p > output/01-before-setup.png

          echo "=== TAP SETUP BUTTON ==="
          adb -s "$DEVICE" shell input tap 105 110
          sleep 3

          adb -s "$DEVICE" shell input tap 105 110
          sleep 5

          echo "=== PRESS HOME ==="
          adb -s "$DEVICE" shell input keyevent HOME
          sleep 5

          echo "=== HOME RESOLVER ==="
          adb -s "$DEVICE" shell cmd package resolve-activity --brief \
            -a android.intent.action.MAIN \
            -c android.intent.category.HOME || true

          echo "=== SCREEN AFTER SETUP ==="
          adb -s "$DEVICE" exec-out screencap -p > output/02-after-setup.png

          echo "=== LAWNCHAIR PACKAGE ==="
          adb -s "$DEVICE" shell dumpsys package app.lawnchair \
            | grep -m 5 "versionName" || true

          echo "LAWNCHAIR_SETUP_TEST_COMPLETE"

      - name: Collect Android logs
        if: always()
        shell: bash
        run: |
          {
            echo "=== DOCKER LOGS ==="
            docker logs nvcloud-android 2>&1 || true

            echo "=== ANDROID LOGCAT ==="
            adb -s 127.0.0.1:5555 logcat -d -t 1500 2>&1 || true
          } >> output/setup.log

      - name: Upload screenshots and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvcloud-android-results
          path: |
            output/*.png
            output/*.txt
            output/*.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker logs nvcloud-android 2>/dev/null || true
          docker rm -f nvcloud-android 2>/dev/null || true

          rm -f "$RUNNER_TEMP/lawnchair.apk"
          rm -f "$RUNNER_TEMP/lawnchair-assets.html"
